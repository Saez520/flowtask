version: 1
name: ask-parent
description: The standard rules, with the parent consulted for shell and network requests no rule covers.
filesystem:
  writable_roots:
    - "${run_cwd}"
  readable_roots:
    - "${run_cwd}"
    - /usr/lib
    - /usr/share
  deny:
    - "${home}/.ssh"
    - "${home}/.aws"
    - "${home}/.config/flowtask/config"
    - "${run_cwd}/.flowtask/config"
shell:
  allow:
    - git status
    - "git diff *"
    - "git add *"
    - "git commit *"
    - "node --test *"
    - npm test
  deny:
    - "git push *"
    - "rm -rf *"
network:
  allow:
    - registry.npmjs.org
tools:
  allow:
    - read
    - edit
    - write
    - grep
    - glob
  deny: []
  mcp_allow:
    - server: docs-server
      tool: "*"
  mcp_deny: []
on_uncovered:
  filesystem: deny
  shell: ask_parent
  network: ask_parent
  tools: deny
